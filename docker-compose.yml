# OpenBuildrOS: Postgres + Agno AgentOS backend + Next.js web UI.
# `make up` builds and starts everything; see .env.example for configuration.
name: openbuildros

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-openbuildr}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:-openbuildr}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]

  # Optional: shares resumable run streams across backend workers.
  #   docker compose --profile scale up -d   with REDIS_URL=redis://redis:6379/0
  redis:
    image: redis:7-alpine
    profiles: [scale]
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20
    networks: [internal]

  backend:
    build:
      context: ./backend
      target: runtime
    image: openbuildros-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      RUNTIME_ENV: ${RUNTIME_ENV:-prd}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # Empty means "use the default in backend/app/settings.py".
      OPENROUTER_MODEL_ID: ${OPENROUTER_MODEL_ID:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-}
      OS_SECURITY_KEY: ${OS_SECURITY_KEY:-}
      DATABASE_URL: postgresql+psycopg://${DB_USER:-openbuildr}:${DB_PASSWORD}@db:5432/${DB_NAME:-openbuildr}
      OPENROUTER_MAX_RETRIES: ${OPENROUTER_MAX_RETRIES:-}
      OPENROUTER_TIMEOUT: ${OPENROUTER_TIMEOUT:-}
      OPENROUTER_FALLBACK_MODELS: ${OPENROUTER_FALLBACK_MODELS:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
      # Set to redis://redis:6379/0 (and start the "scale" profile) for WEB_CONCURRENCY > 1.
      REDIS_URL: ${REDIS_URL:-}
      # Each bot's own computer (browser, workspace, shell): per-bot | shared | off.
      COMPUTER_MODE: ${COMPUTER_MODE:-per-bot}
      SUPERVISOR_URL: http://supervisor:8090
      COMPUTER_URL: http://computer:8080
      COMPUTER_TOKEN: ${COMPUTER_TOKEN:-}
      SUPERVISOR_TOKEN: ${SUPERVISOR_TOKEN:-}
      COMPUTER_POLICY: ${COMPUTER_POLICY:-}
    # Published on localhost only: the UI reaches it over the internal network.
    # Remove the mapping entirely if nothing outside the stack needs the API.
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      supervisor:
        condition: service_healthy
    # computers: reach the bots' computers (which cannot reach the database).
    networks: [internal, computers]
    deploy:
      resources:
        limits: { cpus: "2", memory: 4g }

  # Starts one computer container per bot from the computer image, on the
  # "computers" network. The only service with the Docker socket.
  supervisor:
    build:
      context: ./supervisor
    image: openbuildros-supervisor:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      SUPERVISOR_TOKEN: ${SUPERVISOR_TOKEN:-}
      COMPUTER_TOKEN: ${COMPUTER_TOKEN:-}
      COMPUTER_IMAGE: openbuildros-computer:${IMAGE_TAG:-latest}
      COMPUTER_NETWORK: openbuildros-computers
      COMPUTER_MEMORY: ${COMPUTER_MEMORY:-2g}
      COMPUTER_CPUS: ${COMPUTER_CPUS:-1}
      COMPUTER_IDLE_MINUTES: ${COMPUTER_IDLE_MINUTES:-30}
      # "runsc" runs computers under gVisor where the host has it.
      COMPUTER_RUNTIME: ${COMPUTER_RUNTIME:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [computers]

  # The computer image. Built by `make build`; started per bot by the supervisor,
  # or as this single service with `--profile shared-computer` and COMPUTER_MODE=shared.
  computer:
    build:
      context: ./computer
    image: openbuildros-computer:${IMAGE_TAG:-latest}
    profiles: [shared-computer]
    restart: unless-stopped
    environment:
      COMPUTER_TOKEN: ${COMPUTER_TOKEN:-}
    volumes:
      - workspaces:/workspace
    networks: [computers]

  web:
    build:
      context: ./frontend
    image: openbuildros-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
      OS_SECURITY_KEY: ${OS_SECURITY_KEY:-}
      UI_USERNAME: ${UI_USERNAME:-admin}
      UI_PASSWORD: ${UI_PASSWORD:-}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks: [internal]
    deploy:
      resources:
        limits: { cpus: "1", memory: 1g }

networks:
  internal:
  # Bots' computers live here: internet egress, no route to the database.
  computers:
    name: openbuildros-computers

volumes:
  pgdata:
  workspaces:
